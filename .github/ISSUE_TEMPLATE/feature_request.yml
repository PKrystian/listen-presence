name: Feature request
description: Suggest a change that fits the local-only architecture
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Explain the behavior and its privacy impact.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Architecture boundary
      options:
        - label: This does not require a backend, telemetry, OAuth, user token, or public listener.
          required: true
