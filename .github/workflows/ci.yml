name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  native-host:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - run: go -C native-host vet ./...
      - run: go -C native-host test ./...
      - run: go -C native-host build -buildvcs=false -trimpath -ldflags="-s -w" ./cmd/listenpresence-connector

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - run: go -C installer/windows vet ./...
      - run: go -C installer/windows test ./...

  release-builds:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - run: npm ci
      - run: npm run build:release:all
        env:
          LISTENPRESENCE_EXTENSION_ID: abcdefghijklmnopabcdefghijklmnop
          LISTENPRESENCE_DISCORD_APPLICATION_ID: '123456789012345678'
