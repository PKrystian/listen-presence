name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version: '1.26.x'
          cache: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Clean Go build cache
        run: go clean -cache
        if: matrix.language == 'go'
      - name: Build native host for CodeQL
        working-directory: native-host
        run: go build ./...
        if: matrix.language == 'go'
      - name: Build Windows native host for CodeQL
        working-directory: native-host
        run: go build ./...
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        if: matrix.language == 'go'
      - name: Build macOS native host for CodeQL
        working-directory: native-host
        run: go build ./...
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        if: matrix.language == 'go'
      - name: Build Windows installer for CodeQL
        working-directory: installer/windows
        run: go build ./...
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        if: matrix.language == 'go'
      - uses: github/codeql-action/analyze@v4
